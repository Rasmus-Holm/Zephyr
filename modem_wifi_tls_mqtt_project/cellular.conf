# Modem build: PPP over the Stamp CatM instead of Wi-Fi.
# Passed to west build by run-build.sh via -DEXTRA_CONF_FILE together with cellular-local.conf.
CONFIG_NETWORK_CELLULAR=y
# PPP took about 17 s to assign an IP in cellular-ppp; registration can take longer.
CONFIG_NETWORK_IPV4_TIMEOUT_SECONDS=180

# PPP and the modem driver, as tested in cellular-ppp.
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
# Use the DNS server the mobile network offers during PPP, so pool.ntp.org can be resolved for SNTP.
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
# Name lookups over PPP took 0.5 to 0.7 s or 3.6 to 5.3 s; the default 2 s timeout failed some of them.
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000

# Check the certificate's validity dates against the clock set by SNTP (test; see README).
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MODEM=y
CONFIG_PM_DEVICE=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_APN="onomondo"
# Larger CMUX work buffers, which also size the DLCI 1 (PPP) receive buffer. The default
# (MTU 127 + 7) overran during TLS and MQTT bursts. 512 is a test value, not a measured optimum.
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=512

# AT shell for manual checks over the USB console.
CONFIG_SHELL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_MODEM_AT_SHELL=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y

# Wi-Fi station build. Passed to west build by run-build.sh via -DEXTRA_CONF_FILE.
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=n
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_WIFI_USAGE_MODE_STA=y
CONFIG_WIFI_USAGE_MODE_AP=n
CONFIG_NET_L2_WIFI_MGMT=y

# Network layer: Wi-Fi is the default choice in Kconfig.
CONFIG_NETWORK_CELLULAR=n
CONFIG_NETWORK_IPV4_TIMEOUT_SECONDS=30

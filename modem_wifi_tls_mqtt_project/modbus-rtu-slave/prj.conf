# Console/Logging
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MODBUS_LOG_LEVEL_DBG=y

# Modbus RTU Server
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_SERIAL=y
CONFIG_MODBUS_NONCOMPLIANT_SERIAL_MODE=y


# 1-Wire + DS18B20
CONFIG_W1=y
CONFIG_W1_LOG_LEVEL_INF=y
CONFIG_SENSOR=y
CONFIG_DS18B20=y
CONFIG_SENSOR_LOG_LEVEL_INF=y

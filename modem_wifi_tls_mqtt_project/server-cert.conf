# Server certificate configuration for the old local MQTT broker route.
# Keep the IP-SAN aligned with CONFIG_MQTT_BROKER_ADDRESS in wifi-local.conf.
# The Let's Encrypt experiment uses letsencrypt.conf and a DNS name instead.

[req]
distinguished_name = req_distinguished_name
req_extensions = req_ext
prompt = no

[req_distinguished_name]
CN = 192.168.87.119

[req_ext]
subjectAltName = @alt_names
basicConstraints = critical,CA:FALSE
keyUsage = critical,digitalSignature,keyEncipherment
extendedKeyUsage = serverAuth

[alt_names]
IP.1 = 192.168.87.119
